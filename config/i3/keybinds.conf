# Launch Browser (Luakit)
bindsym $mod+b exec --no-startup-id luakit

# Launch Private Browser (Chromium)
bindsym $mod+Shift+b exec --no-startup-id ~/.local/bin/ungoogled-chromium.AppImage --incognito

# Launch Terminal (st)
bindsym $mod+Return exec --no-startup-id st

# Toggle Scratchpad Terminal
bindsym $mod+Shift+Return exec --no-startup-id ~/.config/i3/scripts/scratchpad

# Launch Application Menu
bindsym $mod+space exec --no-startup-id ~/.config/dmenu/launch.sh

# Launch Wallpaper Menu
bindsym $mod+Shift+w exec --no-startup-id ~/.config/i3/scripts/wallpaper

# Launch Editor (emacs)
bindsym $mod+e exec --no-startup-id emacs

# Launch Wifi Menu
bindsym $mod+c exec --no-startup-id ~/.config/i3/scripts/wifi

# Launch Pulsemixer (Audio Mixer)
bindsym $mod+v exec --no-startup-id ~/.config/i3/scripts/scratchpad pulsemixer pulsemixer

# Show Keybinding Help
bindsym $mod+h exec --no-startup-id ~/.config/i3/scripts/help

# Launch Ida
bindsym $mod+g exec --no-startup-id /home/giovanni/.config/i3/scripts/run_ida.sh

# Lock Screen
bindsym $mod+Control+l exec --no-startup-id i3lock --nofork --show-failed-attempts --ignore-empty-password --tiling -c 000000

# Launch Power Menu
bindsym $mod+p exec --no-startup-id ~/.config/i3/scripts/power

# Paste to Note
bindsym $mod+Shift+v exec --no-startup-id bash -ic 'note clip && notify-send "Clipboard saved to notes"'

# Screenshot: Region Select
bindsym $mod+Print exec --no-startup-id ~/.config/i3/scripts/screenshot select

# Screenshot: Fullscreen
bindsym Print exec --no-startup-id ~/.config/i3/scripts/screenshot full

# Toggle Tabbed Layout
bindsym $mod+w layout toggle tabbed split

# Switch to Workspace 1
bindsym $mod+1 workspace number 1

# Switch to Workspace 2
bindsym $mod+2 workspace number 2

# Switch to Workspace 3
bindsym $mod+3 workspace number 3

# Switch to Workspace 4
bindsym $mod+4 workspace number 4

# Switch to Workspace 5
bindsym $mod+5 workspace number 5

# Switch to Workspace 6
bindsym $mod+6 workspace number 6

# Switch to Workspace 7
bindsym $mod+7 workspace number 7

# Switch to Workspace 8
bindsym $mod+8 workspace number 8

# Switch to Workspace 9 
bindsym $mod+9 workspace number 9

# Switch to Workspace 10
bindsym $mod+0 workspace number 10

# Move Container to Workspace 1
bindsym $mod+Shift+1 move container to workspace number 1

# Move Container to Workspace 2
bindsym $mod+Shift+2 move container to workspace number 2

# Move Container to Workspace 3
bindsym $mod+Shift+3 move container to workspace number 3

# Move Container to Workspace 4
bindsym $mod+Shift+4 move container to workspace number 4

# Move Container to Workspace 5
bindsym $mod+Shift+5 move container to workspace number 5

# Move Container to Workspace 6
bindsym $mod+Shift+6 move container to workspace number 6

# Move Container to Workspace 7
bindsym $mod+Shift+7 move container to workspace number 7

# Move Container to Workspace 8
bindsym $mod+Shift+8 move container to workspace number 8

# Move Container to Workspace 9
bindsym $mod+Shift+9 move container to workspace number 9

# Move Container to Workspace 10
bindsym $mod+Shift+0 move container to workspace number 10

# Focus Left (Arrow)
bindsym $mod+Left focus left

# Focus Down (Arrow)
bindsym $mod+Down focus down

# Focus Up (Arrow)
bindsym $mod+Up focus up

# Focus Right (Arrow)
bindsym $mod+Right focus right

# Move Window Left
bindsym $mod+Shift+Left move left

# Move Window Down
bindsym $mod+Shift+Down move down

# Move Window Up
bindsym $mod+Shift+Up move up

# Move Window Right
bindsym $mod+Shift+Right move right

# Toggle Mute
bindsym $mod+m exec --no-startup-id ~/.config/i3/scripts/changevolume mute

# Volume Down
bindsym XF86AudioRaiseVolume exec --no-startup-id pamixer -i 2

# Volume Up
bindsym XF86AudioLowerVolume exec --no-startup-id pamixer -d 2

# Play Content (Media Key)
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause

# Pause Content (Media Key)
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause

# Next Content (Media Key)
bindsym XF86AudioNext exec --no-startup-id playerctl next

# Previous Content (Media Key)
bindsym XF86AudioPrev exec --no-startup-id playerctl previous

# Toggle Fullscreen
bindsym $mod+Mod1+f fullscreen toggle

# Toggle Floating
bindsym $mod+Shift+space floating toggle

# Toggle Focus (Tiling/Floating)
bindsym $mod+Control+space focus mode_toggle

# Focus Parent Container
bindsym $mod+Mod1+a focus parent

# Exit i3
bindsym $mod+Shift+q exec --no-startup-id i3-msg exit

# Close Window
bindsym $mod+q kill

# Reload i3 Config
bindsym $mod+Shift+c reload

# Restart i3
bindsym $mod+Shift+r restart

# Resize Grow Width
bindsym $mod+Control+Left resize grow width 3 px or 3 ppt

# Resize Shrink Height
bindsym $mod+Control+Down resize shrink height 3 px or 3 ppt

# Resize Grow Height
bindsym $mod+Control+Up resize grow height 3 px or 3 ppt

# Resize Shrink Width
bindsym $mod+Control+Right resize shrink width 3 px or 3 ppt

# Split Vertical
bindsym $mod+Mod1+v split vertical

# Split Horizontal
bindsym $mod+Mod1+z split horizontal

# Move to Scratchpad
bindsym $mod+minus move scratchpad

# Show Scratchpad
bindsym $mod+equal scratchpad show

# Return Scratchpad Window to Tiling
bindsym $mod+Shift+equal floating disable

# Duplicate Screen to HDMI-1
bindsym $mod+Shift+s exec --no-startup-id xrandr --output HDMI-1 --auto --same-as eDP-1
